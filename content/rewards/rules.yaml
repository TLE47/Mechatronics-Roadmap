# Behaviour, not speed. Each mark records a way of learning that a test can see.
proofMarks:
  - id: predicted
    label: Predicted
    earnedWhen: You committed to a prediction before Run and it matched
    why: Builds a mental model instead of a guess
  - id: read-the-evidence
    label: Read the Evidence
    earnedWhen: You fixed a failure after opening its diagnostic card
    why: Rewards debugging rather than retrying
  - id: second-opinion
    label: Second Opinion
    earnedWhen: You solved it after using a hint
    why: Makes asking for help something to be proud of
  - id: different-input
    label: Different Input
    earnedWhen: You verified a lesson again, much later, with different values
    why: Shows learning that lasted
  - id: before-and-after
    label: Before and After
    earnedWhen: You pinned two runs and compared them
    why: Teaches evidence-based tuning
  - id: field-repair
    label: Field Repair
    earnedWhen: You repaired a fault in a fault call
    why: Shows transfer to an unfamiliar problem

