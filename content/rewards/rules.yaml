# MechaLab 3.0 reward rules — the one file every number comes from.
#
# Reviewed like any other content: a pull request, not an app release. The engine
# (app/src/gamification/rewards.ts) reads this and nothing else, so a rule that is not here
# is a rule the game does not have.
#
# Hard rules, restated where they are implemented:
#   * a level is earned by verifying a mission's checks, never by Neon, idle time or speed;
#   * no reward may lock Run, hints, scopes or any learning tool;
#   * every award is idempotent (a stable id in a ledger), so a restore or a second device
#     can never grant the same thing twice;
#   * hints never reduce anything (neon.hints is 0 on purpose, not a missing field).
version: 1

