<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- `viewport-fit=cover` is what lets the installed app paint into the notch: without it iOS
         letterboxes the page and `env(safe-area-inset-*)` is always zero. -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <title>MechaLab — Learn Mechatronics by Building a Robot Arm</title>
    <meta
      name="description"
      content="A free, browser-based mechatronics course: from no coding or electronics to a verified simulated 2-DOF robot arm. Python 3.12 runs in the tab, with nothing to install and $0 of hardware."
    />
    <meta name="theme-color" content="#070b12" />
    <meta name="color-scheme" content="dark light" />
    <!-- Theme before first paint. Stored choice wins; otherwise the OS decides, and a request for
         more contrast outranks the dark/light preference. This is the only place the storage key is
         duplicated (src/theme.ts owns it), because it has to run before the bundle loads. A throw
         (private mode) leaves the dark default in place. -->
    <script>
      (function () {
        try {
          var stored = localStorage.getItem('mechalab_theme_v1');
          var theme = null;
          if (stored === 'light' || stored === 'dark' || stored === 'contrast' || stored === 'paper')
            theme = stored;
          if (!theme) {
            var query = window.matchMedia;
            if (query && query('(prefers-contrast: more)').matches) theme = 'contrast';
            else if (!query || query('(prefers-color-scheme: dark)').matches) theme = 'dark';
            else theme = 'light';
          }
          document.documentElement.setAttribute('data-theme', theme);
          document.documentElement.style.colorScheme =
            theme === 'light' || theme === 'paper' ? 'light' : 'dark';
          var meta = document.querySelector('meta[name="theme-color"]');
          if (meta) {
            meta.setAttribute(
              'content',
              theme === 'light'
                ? '#f8f6f2'
                : theme === 'paper'
                  ? '#efe4d0'
                  : theme === 'contrast'
                    ? '#000000'
                    : '#070b12'
            );
          }
        } catch (error) {
          document.documentElement.setAttribute('data-theme', 'dark');
        }
      })();
    </script>
    <!-- The service worker, which does two jobs because a page can only have one: it adds the COOP/COEP
         pair a static host cannot send (so SharedArrayBuffer exists and the Python worker can be
         interrupted in place), and it caches the shell and assets so the workbench opens offline. It
         reloads the page once, into the isolated document. Local servers send the headers themselves,
         so this exits early and never gets between HMR and the dev server. -->
    <script src="sw.js"></script>

    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!-- iOS reads this link rather than the manifest, and ignores `display: standalone`'s
         theme colour; the status bar is translucent so the header's own background shows through. -->
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="MechaLab" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="manifest" href="/manifest.webmanifest" />

    <!-- Social cards. The image is docs/media/social-preview.png, copied into public/ so Pages
         serves it at a stable URL; scripts/generate_social_preview.mjs renders it. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="MechaLab" />
    <meta property="og:title" content="MechaLab — Learn Mechatronics by Building a Robot Arm" />
    <meta
      property="og:description"
      content="48 browser-based lessons from zero background to a working simulated 2-DOF robot arm. No install, no kit, free."
    />
    <meta property="og:image" content="https://tle47.github.io/Mechatronics-Roadmap/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="MechaLab — Learn Mechatronics by Building a Robot Arm" />
    <meta
      name="twitter:description"
      content="48 browser-based lessons from zero background to a working simulated 2-DOF robot arm. No install, no kit, free."
    />
    <meta name="twitter:image" content="https://tle47.github.io/Mechatronics-Roadmap/og.png" />

    <!-- No third-party stylesheet, and no third-party font: KaTeX's CSS and its woff2 faces are
         bundled from node_modules (`app/src/main.tsx`, `vite.config.ts`), so formulas render on a
         machine that cannot reach a CDN. -->
  </head>
  <body class="bg-canvas text-ink antialiased">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
