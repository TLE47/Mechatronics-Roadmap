<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MechaLab — Learn Mechatronics by Building a Robot Arm</title>
    <meta
      name="description"
      content="A free, browser-based mechatronics course: from no coding or electronics to a verified simulated 2-DOF robot arm. Python 3.12 runs in the tab, with nothing to install and $0 of hardware."
    />
    <meta name="theme-color" content="#070b12" />
    <meta name="color-scheme" content="dark light" />
    <!-- Theme before first paint. Stored choice wins; otherwise the OS decides. This is the only
         place the storage key is duplicated (src/theme.ts owns it), because it has to run before
         the bundle loads. A throw (private mode) leaves the dark default in place. -->
    <script>
      (function () {
        try {
          var stored = localStorage.getItem('mechalab_theme_v1');
          var dark = stored === 'dark';
          var light = stored === 'light';
          if (!dark && !light) {
            dark = !window.matchMedia || window.matchMedia('(prefers-color-scheme: dark)').matches;
            light = !dark;
          }
          var theme = light ? 'light' : 'dark';
          document.documentElement.setAttribute('data-theme', theme);
          document.documentElement.style.colorScheme = theme;
          var meta = document.querySelector('meta[name="theme-color"]');
          if (meta) meta.setAttribute('content', theme === 'dark' ? '#070b12' : '#f8f6f2');
        } catch (error) {
          document.documentElement.setAttribute('data-theme', 'dark');
        }
      })();
    </script>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="manifest" href="/manifest.webmanifest" />

    <!-- Social cards. The image is docs/media/social-preview.png, copied into public/ so Pages
         serves it at a stable URL; scripts/generate_social_preview.mjs renders it. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="MechaLab" />
    <meta property="og:title" content="MechaLab — Learn Mechatronics by Building a Robot Arm" />
    <meta
      property="og:description"
      content="48 browser-based lessons from zero background to a working simulated 2-DOF robot arm. No install, no kit, free."
    />
    <meta property="og:image" content="https://tle47.github.io/Mechatronics-Roadmap/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="MechaLab — Learn Mechatronics by Building a Robot Arm" />
    <meta
      name="twitter:description"
      content="48 browser-based lessons from zero background to a working simulated 2-DOF robot arm. No install, no kit, free."
    />
    <meta name="twitter:image" content="https://tle47.github.io/Mechatronics-Roadmap/og.png" />

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.21/dist/katex.min.css" />
  </head>
  <body class="bg-canvas text-ink antialiased">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
