name: Record the surface snapshot (temporary)

# The surface baseline has to be recorded on the runner whose rendering it grades: a baseline
# recorded on a developer machine disagrees with Ubuntu's font metrics by up to 27 px on two
# surfaces. This job records it, commits the baseline, and deletes itself in the same commit.

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  record:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install the locked dependencies
        run: npm ci --prefer-offline --no-audit --no-fund

      - name: Build the bundle the snapshot measures
        run: |
          npm run prebuild
          npx vite build

      - name: Install Chromium
        run: npx playwright-core install chromium

      - name: Record the surfaces
        run: node scripts/snapshot_surfaces.mjs --record

      - name: Commit the baseline and retire this workflow
        run: |
          git config user.name "snapshot-recorder"
          git config user.email "actions@users.noreply.github.com"
          git add docs/surface-snapshot.json
          git rm .github/workflows/record-snapshot.yml
          git commit -m "Record the surface snapshot on the runner"
          git push
