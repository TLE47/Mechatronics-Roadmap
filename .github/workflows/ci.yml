        run: npm run test:offline

  deploy-pages:
    name: Deploy MechaLab Workbench to GitHub Pages
    # Every gate, not only the build: a red audit cannot publish the bundle it graded, and a red
    # Python sweep must still stop the publish now that the build no longer waits for it. Nothing is
    # skipped on `main`, so this list is always the full matrix there.
    needs:
      [
        changes,
        python-text,
        python-exercises,
        python-labs,
        macos-python,
        native-install-macos,
        typecheck,
        node-unit,
        build-workbench,
        e2e-suites,
        bundle-suites,
        audit-suites,
        runtime-suites,
      ]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy the built bundle to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
