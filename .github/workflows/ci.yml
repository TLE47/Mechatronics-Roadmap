name: Mechatronics Roadmap & Reference Labs CI

on:
  push:
    branches: ["main", "master", "**"]
  pull_request:
    branches: ["main", "master"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  verify-and-test:
    name: Repository Integrity, Math/Mermaid Lint & Labs 00-08 (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Verify Markdown structure, internal links, Mermaid diagrams & LaTeX math fences
        run: |
          # The workflows themselves come first: a file GitHub cannot parse is a run that fails in
          # 0 s with no jobs, and nothing inside the job ever gets to report it. This scan needs no
          # YAML parser; a contributor with actionlint installed gets the full lint too.
          python3 scripts/check_workflows.py
          python3 scripts/verify_repo.py --verbose
          python3 scripts/clean_tex.py --check
          python3 scripts/validate_modules.py
          python3 scripts/lint_lessons.py
          python3 scripts/check_ramp_lessons.py
          python3 scripts/audit_step_size.py --check
          python3 scripts/legacy_crosswalk.py --check
          python3 scripts/mentions_audit.py --check
          python3 scripts/lint_modules.py
          python3 scripts/module_parity.py --check
          python3 scripts/generate_ladder_gate.py --check
          python3 scripts/generate_skip_tests.py --check
          python3 scripts/generate_plant_data.py --check
          python3 scripts/check_term_order.py
          python3 scripts/generate_python_lessons_data.py --check
          # The lesson text the workbench renders beside the editor, generated from the same pages
          # the runner's registry names. A page edited without regenerating is stale here.
          python3 scripts/generate_lesson_pages.py --check
          # The app's error index is the explainer page; editing one without the other fails here.
          python3 scripts/generate_error_index.py --check
          python3 scripts/generate_run_callouts.py --check
          # The searchable text of the 65 reading pages, which the app fetches only when asked.
          python3 scripts/generate_prose_index.py --check
          # One name per tab, in one file; no page or label may point at a position instead.
          python3 scripts/check_tab_names.py
          python3 scripts/generate_link_history_data.py --check
          python3 scripts/generate_sim_route.py --check
          # The ten steps the pages print, copied for the app by the same model.
          python3 scripts/generate_spine_data.py --check
          # One order: every arm page's last line names the next page in that same model.
          python3 scripts/generate_next_links.py --check
          # The syllabus, the curriculum map and the nine track READMEs cost those ten steps
          # from each page's own metadata; a moved page must move the hours with it.
          python3 scripts/generate_step_docs.py --check
          python3 scripts/generate_readme_counts.py --check
          # The Board card's data is the five Arduino lessons' own sketches plus the serial this job
          # proves for them; a lesson that edits its sketch must not leave the card on the old one.
          python3 scripts/extract_and_compile_sketches.py --check-panel
          # The Board tab runs these bytes: every committed `.hex` must have been built from the
          # sketch the page ships, and be the file the index hashes (the Node suite runs them).
          python3 scripts/extract_and_compile_sketches.py --check-firmware
          # Every `npm run …` and every `scripts/…` path an instruction page names must exist. The
          # gate list had this coverage; the prose did not, and its first run found the plan telling
          # a reader to run `npm run test:e2e:storage` for a suite package.json had never declared.
          python3 scripts/check_doc_commands.py
          # The 2.0 gap page is a contract now that every row reads `ships`: a reopened row fails here,
          # and so does a `ships` row that names no command or browser step a reader can run.
          python3 scripts/check_plan_rows.py
          python3 scripts/check_consistency.py
          python3 scripts/friction_report.py --check
          python3 scripts/lint_assertions.py
          # The 48-package sweep runs once: packages are checked in parallel workers, and this
          # report is what tests/test_exercise_package.py reads instead of running it a second
          # time. It refuses a report that does not name every package on disk, so the reuse
          # cannot hide an unverified package.
          python3 scripts/run_exercise.py --verbose \
            --report-file "${RUNNER_TEMP:-/tmp}/run-exercise.json"
          python3 scripts/check_exercise_coverage.py
          # One discovery run covers all 21 suites in tests/ - including test_sketch_host_verify
          # and test_module_full_solutions, which the old per-file list never ran - and it is the
          # same command CONTRIBUTING gives a contributor. It runs on the 3.12 interpreter the
          # repo pins in .python-version, so every script a test imports must run there.
          RUN_EXERCISE_REPORT="${RUNNER_TEMP:-/tmp}/run-exercise.json" \
            python3 -m unittest discover -s tests

      # The KaTeX audit used to live here, behind an `npm install --no-save katex` on both runners,
      # to re-fetch a dependency the lockfile already pins. It is OS-independent text checking, so it
      # runs in build-workbench instead, where `npm ci` has already put katex in node_modules. This
      # job is Python only.
      - name: Run all 13 Python & C++20 Reference Simulations, Module Expected-Output Diffs, CAD, PCB EDA & Firmware Tests
        run: python3 scripts/run_all_labs.py --verbose

  native-install-macos:
    # A lockfile resolved on Linux records only Linux's optional binaries, so `npm ci` on a
    # Mac installs none of the natives rollup/esbuild/Tailwind/Lightning CSS need, and the
    # failure surfaces later as `Cannot find module '@rollup/rollup-darwin-arm64'`.
    # This job installs from scratch on macOS and proves the binaries actually load.
    name: Fresh install on macOS (npm ci) has every native binary the build needs
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Set up Python 3.12 (the build's prebuild step generates lesson data)
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install the locked dependencies from scratch
        run: npm ci

      - name: Assert npm ci installed every optional binary the lockfile owes this platform
        run: npm run check:native

      - name: Build the workbench (rollup, esbuild, Tailwind oxide & Lightning CSS all run natively)
        run: npm run build

  build-workbench:
    name: Typecheck & build the Vite workbench bundle
    needs: verify-and-test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install the locked dependencies
        run: npm ci

      - name: Assert npm ci installed every optional binary recorded for linux/x64
        run: npm run check:native

      - name: Typeset every formula (Markdown modules + workbench curriculum) with KaTeX
        run: node scripts/audit_math.mjs .

      # Sign-in is optional: with neither repository variable set the bundle ships local-only and the
      # account panel says so. The anon key is public by design (row-level security guards the rows).
      - name: Typecheck and build the production bundle (base /Mechatronics-Roadmap/)
        env:
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY }}
        run: npm run build

      - name: Check the cloud-sync merge rules (local vs account progress)
        run: npm run test:merge

      - name: Check the 08.1 fault-bench metrics
        run: npm run test:faultbench

      - name: Check the roadmap <-> workbench join (every entry claimed once)
        run: npm run test:practice

      # What the bundle costs, in gzipped bytes, against docs/weight-budget.json: a metric over its
      # budget fails, and so does a budget the build no longer produces anything for. It reads the
      # `dist/` the step above just built — signed_in here — and on a machine whose build is
      # local-only it builds the signed-in shape beside it, so the same gate can fail before a push.
      - name: "Check the weight budget: gzipped shell, largest chunk, and no metric left unmeasured"
        run: npm run check:weight

      - name: Install Playwright Chromium & Firefox (once, for both browser suites)
        run: npx playwright-core install --with-deps chromium firefox

      # One dev server, one built bundle, four suites side by side: the SSR smoke test, the dev-server
      # E2E run, the built-bundle E2E run and the same-task control-pair sweep. Before, each of them
      # booted its own server (and the bundle suite rebuilt when dist/ was absent), one after another.
      # `npm run test:smoke`, `test:e2e`, `test:e2e:pages` and `test:pairs` still run standalone.
      - name: Run the Workbench suites (SSR smoke, dev-server E2E, built-bundle E2E, control pairs) on one server pair
        run: npm run test:workbench

      # Its own step, not a seventh suite in the parallel run above: it drives a browser through all
      # eleven tabs twice, and under that much contention the older suites start missing their 30 s
      # click timeouts. Alone it takes ~35 s and fails on a contrast regression, not on a slow runner.
      # A colon inside a step name has to be quoted: unquoted, YAML reads the second `: ` as another
      # mapping and the whole workflow fails to parse, which GitHub reports as a run that fails in 0 s.
      - name: "Check light/dark: toggle contract, and WCAG contrast on all 11 tabs in both modes"
        run: npm run test:theme:e2e

      # axe, not contrast: unnamed controls, roles nested where they may not be, a scroll region no
      # keyboard can reach. It walks the same eleven tabs in both palettes and fails on any
      # serious/critical finding that docs/a11y-allowlist.json does not explain.
      - name: "Check accessibility: axe over all 11 tabs in both themes"
        run: npm run check:axe

      # Lighthouse's own three categories—best-practices, SEO and accessibility—on the built bundle,
      # against docs/lighthouse-allowlist.json. Both default palettes are audited, each pinned with a
      # launch flag and verified in the browser first: a runner with no prefers-color-scheme preference
      # used to be graded in light while a developer's Mac was graded in dark. Performance is
      # deliberately not run: a score that moves with the runner is not a gate this repository keeps
      # (the script's header says so, and the row in docs/PLAN-2.0-GAP.md records the decision).
      - name: "Check Lighthouse: best-practices, SEO and accessibility on the built bundle"
        run: npm run check:lighthouse

      # The painted surface of all 44 tab/palette combinations against docs/surface-snapshot.json:
      # where the header, rail, main pane and panel sit, how many controls the tab has, and the resolved
      # colours and type. Not a pixel diff, because antialiasing does not survive macOS -> Linux; the
      # script's header explains, and geometry is compared with a 2 px tolerance.
      - name: "Check the surface snapshot: every tab in every palette is still shaped the same"
        run: npm run check:snapshot

      # The first screen's type, measured rather than read off a class list: the runner's row at rest
      # carries at most seven controls, More still reveals all thirteen folded ones, and every control
      # (12 px), primary action (13 px), metadata line (11 px) and lesson paragraph (17-18 px) meets
      # §3 of docs/PLAN-2.1a.md at 1280x800 in a real Chromium.
      - name: "Check label sizes: the quiet row, the folded toolbar, and reading text at 17-18 px"
        run: npm run check:labels

      # The other half of §4 of docs/PLAN-2.1a.md: the walk itself is deliberately not a CI step
      # (its six moments would be a function of the runner's contention, the same reason
      # check:lighthouse does not score performance), so what CI holds is the page: docs/PERF.md and
      # docs/perf-budget.json must still describe the same six moments, and no recorded number may
      # sit above its own ceiling. Cheap, no browser, and it fails the moment the doc drifts.
      - name: "Check the perf page: six moments, both profiles, no row above its ceiling"
        run: npm run test:perf:unit

      # The interrupt path needs cross-origin isolation and a real SharedArrayBuffer, which no unit
      # test can provide: this suite stops a `while True:` in place, proves the interpreter survived
      # it, and answers an `input()` mid-run. It downloads Pyodide once, so it is its own step rather
      # than a fifth suite competing for the same machine.
      - name: "Check the Python worker: in-place Stop, input(), isolation, and the no-buffer fallback"
        run: npm run test:runtime

      # A third step of its own, for the same reason: this one serves the built bundle WITHOUT the
      # isolation headers, the way GitHub Pages does, so the service worker has to supply them - and then
      # takes the browser offline. Nothing in the other suites runs with the network off.
      - name: "Check the offline workbench: worker-supplied isolation, cached shell, offline reload"
        run: npm run test:offline

      - name: Configure Pages
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: actions/configure-pages@v5

      - name: Upload the built workbench as the Pages artifact
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy-pages:
    name: Deploy MechaLab Workbench to GitHub Pages
    needs: build-workbench
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy the built bundle to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
