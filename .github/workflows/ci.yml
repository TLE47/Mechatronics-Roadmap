name: Mechatronics Roadmap & Reference Labs CI

# One run per push. `main` is the only branch that starts a run from a push; a feature branch is
# graded by its pull request, so `"**"` here used to start two identical runs for one push (the
# `push` event and the pull request's `synchronize` event) and pay for both.
on:
  push:
    branches: ["main", "master"]
  pull_request:
    branches: ["main", "master"]
  # The nightly run is where the macOS legs live beside `main`: a macOS-only difference in the
  # exercises or the labs is worth catching without waiting for a dependency bump.
  schedule:
    - cron: "0 4 * * *"
  workflow_dispatch:

# A newer push to the same pull request cancels the run it supersedes: that run's verdict is about a
# commit nobody is waiting for. `main` is never cancelled, because its run is the one that publishes.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  # What changed, so a docs-only pull request does not start four browser lanes and a macOS queue.
  # `main` and the nightly/dispatched runs ignore this verdict (see each job's `if:`), so nothing is
  # ever skipped on the branch that publishes.
  changes:
    name: Classify the change
    runs-on: ubuntu-latest
    outputs:
      browser: ${{ steps.filter.outputs.browser }}
      macos: ${{ steps.filter.outputs.macos }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Filter the changed paths
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            browser:
              - 'app/**'
              - 'package.json'
              - 'package-lock.json'
              - 'vite.config.ts'
              - 'scripts/**/*.mjs'
              - '.github/workflows/**'
            macos:
              - 'package.json'
              - 'package-lock.json'
              - 'vite.config.ts'

  # The text gates, in one job on Ubuntu, from the same table a contributor runs. `check_all.py`
  # runs them in parallel and reports every failure: one push shows all the reds instead of one per
  # rerun. The exercise sweep and the unittest discovery are order-dependent and live below.
  python-text:
    name: Text gates — Markdown, math, generated data, workflows
    needs: changes
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Restore node_modules
        id: node-modules
        uses: actions/cache@v4
        with:
          path: node_modules
          key: node-modules-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install the locked dependencies
        if: steps.node-modules.outputs.cache-hit != 'true'
        run: npm ci --prefer-offline --no-audit --no-fund

      - name: Assert npm ci installed every optional binary recorded for linux/x64
        run: npm run check:native

      # The gate list is `scripts/check_all.py`, so CI and a pre-push run grade the same table.
      # `--ci` leaves out the audit gates (they need a browser) and the order-dependent sweeps
      # (the exercise report and the discovery run are the job below).
      - name: Run every text gate, reporting all failures
        run: python3 scripts/check_all.py --ci

  # The 48-package exercise sweep writes the report the discovery run reads back, so these three
  # steps are one job in this order rather than three parallel ones.
  python-exercises:
    name: Exercises and unittest discovery
    needs: changes
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # The 48-package sweep runs once: packages are checked in parallel workers, and this report is
      # what tests/test_exercise_package.py reads instead of running it a second time. It refuses a
      # report that does not name every package on disk, so the reuse cannot hide a package.
      - name: Run the exercise sweep and write the report the tests reuse
        run: |
          python3 scripts/run_exercise.py --verbose \
            --report-file "${RUNNER_TEMP:-/tmp}/run-exercise.json"
          python3 scripts/check_exercise_coverage.py

      # One discovery run covers all 22 suites in tests/, on the interpreter `.python-version` pins.
      - name: Run the unittest discovery
        env:
          RUN_EXERCISE_REPORT: ${{ runner.temp }}/run-exercise.json
        run: python3 -m unittest discover -s tests

  python-labs:
    name: Python and C++20 reference labs
    needs: changes
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run all 13 Python and C++20 reference simulations, module diffs, CAD, PCB and firmware tests
        run: python3 scripts/run_all_labs.py --verbose

  # macOS exists to catch OS differences in the exercises and the labs, so it keeps exactly those,
  # and only where a dependency or the build configuration can move: `main`, the nightly run, or a
  # pull request that touches package*.json or vite.config.ts. The Intel pool is scarce and the
  # Python leg was the slowest one measured (1m57s), which is why it no longer rides every PR.
  macos-python:
    name: macOS — exercises and labs
    needs: changes
    if: github.ref == 'refs/heads/main' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || needs.changes.outputs.macos == 'true'
    runs-on: macos-15-intel

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run the exercise sweep
        run: python3 scripts/run_exercise.py --verbose

      - name: Run all 13 Python and C++20 reference simulations, module diffs, CAD, PCB and firmware tests
        run: python3 scripts/run_all_labs.py --verbose

  # A lockfile resolved on Linux records only Linux's optional binaries, so `npm ci` on a Mac
  # installs none of the natives rollup/esbuild/Tailwind/Lightning CSS need. `check:native` derives
  # the expected packages from the actual darwin/x64 target. The build that used to ride here proved
  # nothing the Linux build does not already prove, so this job is the install alone.
  native-install-macos:
    name: Fresh install on macOS Intel has every native binary the build needs
    needs: changes
    if: github.ref == 'refs/heads/main' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || needs.changes.outputs.macos == 'true'
    runs-on: macos-15-intel

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Assert the macOS runner is the Intel target this job tests
        run: |
          node -e 'const { platform, arch } = process; if (platform !== "darwin" || arch !== "x64") { console.error("[FAIL] expected darwin/x64 for macos-15-intel, got " + platform + "/" + arch); process.exit(1); } console.log("[PASS] native target is " + platform + "/" + arch);'

      - name: Install the locked dependencies from scratch
        run: npm ci --prefer-offline --no-audit --no-fund

      - name: Assert npm ci installed every optional binary the lockfile owes this platform
        run: npm run check:native

  # Typecheck without the bundle: `tsc -b` needs no `dist`, so it runs beside the build instead of
  # inside it. `npm run build` used to do both, and the typecheck then waited behind the whole build.
  typecheck:
    name: Typecheck the workbench
    needs: [changes, build-workbench]
    if: github.ref == 'refs/heads/main' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || needs.changes.outputs.browser == 'true'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Restore node_modules
        id: node-modules
        uses: actions/cache@v4
        with:
          path: node_modules
          key: node-modules-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install the locked dependencies
        if: steps.node-modules.outputs.cache-hit != 'true'
        run: npm ci --prefer-offline --no-audit --no-fund

      - name: Restore the TypeScript build info
        uses: actions/cache@v4
        with:
          path: "**/*.tsbuildinfo"
          key: tsbuildinfo-${{ runner.os }}-${{ hashFiles('package-lock.json', 'tsconfig*.json', 'app/tsconfig*.json') }}-${{ github.sha }}
          restore-keys: |
            tsbuildinfo-${{ runner.os }}-

      - name: Typecheck every project reference
        run: npx tsc -b

  # The Node unit checks, none of which needs `dist`: they grade source modules. They used to ride
  # behind the bundle build, which made the two wait on each other for no reason.
  node-unit:
    name: Node unit checks
    needs: changes
    if: github.ref == 'refs/heads/main' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || needs.changes.outputs.browser == 'true'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Restore node_modules
        id: node-modules
        uses: actions/cache@v4
        with:
          path: node_modules
          key: node-modules-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install the locked dependencies
        if: steps.node-modules.outputs.cache-hit != 'true'
        run: npm ci --prefer-offline --no-audit --no-fund

      - name: Assert npm ci installed every optional binary recorded for linux/x64
        run: npm run check:native

      - name: Typeset every formula (Markdown modules + workbench curriculum) with KaTeX
        run: node scripts/audit_math.mjs .

      - name: Check the cloud-sync merge rules (local vs account progress)
        run: npm run test:merge

      - name: Check the account rules (sign-in, return-to, workspace merge, admin gate)
        run: npm run test:accounts

      - name: Check the 08.1 fault-bench metrics
        run: npm run test:faultbench

      - name: Check the 3.0 reward engine (levels, ledger idempotence, night shifts, stamps)
        run: npm run test:game

      - name: Check the roadmap <-> workbench join (every entry claimed once)
        run: npm run test:practice

      - name: Check the content bundle (story, missions, reward rules)
        run: npm run test:content

      - name: "Check the perf page: six moments, both profiles, no row above its ceiling"
        run: npm run test:perf:unit

  build-workbench:
    name: Build the Vite workbench bundle
    needs: changes
    # No `needs:` on the Python jobs on purpose. A needs chain is a runner handoff, and this one
    # waited for the slowest leg of the Python sweep (the macOS one, 1m57s measured on run
    # 40616101620), so the first browser test could not start before 2m40s and every one of those
    # minutes bought nothing. A run is green only when every job passed, so the sweep still blocks
    # the merge; it just no longer blocks the machine.
    if: github.ref == 'refs/heads/main' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || needs.changes.outputs.browser == 'true'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      # `vite build` does not run the typecheck (`tsc -b`, its own job) but `prebuild` is npm's own
      # hook, so calling `npm run prebuild` is what makes the generated lesson data current without
      # running `npm run build` (which would typecheck the same tree a second time).
      - name: Set up Python 3.12 (the prebuild step generates lesson data)
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Restore node_modules
        id: node-modules
        uses: actions/cache@v4
        with:
          path: node_modules
          key: node-modules-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install the locked dependencies
        if: steps.node-modules.outputs.cache-hit != 'true'
        run: npm ci --prefer-offline --no-audit --no-fund

      - name: Assert npm ci installed every optional binary recorded for linux/x64
        run: npm run check:native

      - name: Restore the Vite build cache
        uses: actions/cache@v4
        with:
          path: node_modules/.vite
          key: vite-cache-${{ runner.os }}-${{ hashFiles('package-lock.json', 'vite.config.ts', 'app/src/**') }}
          restore-keys: |
            vite-cache-${{ runner.os }}-

      # Sign-in is optional: with neither repository variable set the bundle ships local-only and the
      # account panel says so. The anon key is public by design (row-level security guards the rows).
      - name: Generate the lesson data and build the production bundle (base /Mechatronics-Roadmap/)
        env:
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY }}
        run: |
          npm run prebuild
          npx vite build

      # The bundle every browser job tests. This is what lets the browser work leave this job at
      # all: one build is shared by four lanes, and no lane has to remake the bytes it grades.
      - name: Publish the built bundle for the browser jobs
        uses: actions/upload-artifact@v4
        with:
          name: workbench-dist
          path: dist
          retention-days: 1
          if-no-files-found: error

      - name: Configure Pages
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: actions/configure-pages@v5

      - name: Upload the built workbench as the Pages artifact
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  # The browser matrix in three lanes, split by cost rather than by subject. The dev-server lane was
  # the longest job in the run that proved the cache work (6m18s, run 42962870218): its eleven suites
  # queued three waves deep around one suite that is ~250s warm on its own. It is a two-shard matrix
  # now - `e2e-a` keeps that suite plus four flows, `e2e-b` the remaining six, so each lane is a wave
  # behind the sweep instead of three. `bundle` keeps the built-bundle sweep and the control pairs.
  # Each job still fetches the one build and starts its own server pair, so a shard passes exactly
  # when the whole matrix would.
  e2e-suites:
    name: Browser suites — the dev-server sweep and its light flows (shard ${{ matrix.shard }})
    needs: [changes, build-workbench]
    if: github.ref == 'refs/heads/main' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || needs.changes.outputs.browser == 'true'
    strategy:
      # One shard's red is not the other's verdict: `fail-fast` would cancel the second half and
      # leave the run with a lane nobody graded.
      fail-fast: false
      matrix:
        shard: [e2e-a, e2e-b]
    runs-on: ubuntu-latest
    env:
      # This lane launches Chromium only; installing Firefox here was a browser no suite opened.
      PW_BROWSERS: chromium
      # TEMPORARY: the split's seam is chosen from these timings; removed with them.
      E2E_TIMINGS: "1"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Restore node_modules
        id: node-modules
        uses: actions/cache@v4
        with:
          path: node_modules
          key: node-modules-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install the locked dependencies
        if: steps.node-modules.outputs.cache-hit != 'true'
        run: npm ci --prefer-offline --no-audit --no-fund

      # The bundle was built once, in build-workbench. Its archive is older than this checkout's
      # files, so the next step stamps it; from there every suite's `ensureBuilt` reuses it.
      - name: Fetch the bundle the build job produced
        uses: actions/download-artifact@v4
        with:
          name: workbench-dist
          path: dist

      # The archive carries the build job's timestamps, and this checkout's files are newer than that
      # clock — so every suite's `ensureBuilt` would read the handed-over bundle as stale and build it
      # again, in three lanes at once. Stamping it to now is the same statement the mtime comparison is
      # trying to make: these bytes were built from this commit, earlier in this same run.
      - name: Stamp the restored bundle as newer than this checkout
        run: find dist -exec touch {} +

      # The cache key follows the Playwright version, not the lockfile hash: a dependency bump that
      # leaves Playwright alone must not throw away four browser installs. The fallback key lets a
      # version change reuse what is there and fetch only the new build.
      - name: Read the installed Playwright version
        id: pw
        run: node -p "'v=' + require('playwright-core/package.json').version" >> "$GITHUB_OUTPUT"

      - name: Restore the Playwright browsers
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.pw.outputs.v }}
          restore-keys: |
            playwright-${{ runner.os }}-

      # On a hit the install is a no-op (measured 7-23s per lane); on a miss it is bounded, and the
      # OS libraries ride the same miss. Installing the browser and its dependencies in one step took 17m31s once (run 40559024836) pulling ~30
      # packages from a throttled mirror, so the apt half is separate and conditional.
      - name: Install the Playwright browsers (only a cache miss needs them)
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright-core install ${{ env.PW_BROWSERS }}
        timeout-minutes: 8

      - name: Install the Playwright OS libraries (only a cache miss needs them)
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright-core install-deps ${{ env.PW_BROWSERS }}
        timeout-minutes: 10

      - name: Run the e2e partition (the SSR smoke, the unit batch, the dev-server sweep with the robot examples and clock log, the light flows)
        env:
          # A suite that finds the handed-over bundle stale must fail here, not rebuild it: the
          # stamp above is the statement that these bytes came from this commit.
          MECHALAB_PREBUILT_DIST: "1"
        run: |
          set +e
          npm run test:workbench -- --partition ${{ matrix.shard }} > /tmp/e2e-partition.log 2>&1
          status=$?
          cat /tmp/e2e-partition.log
          if [ "$status" -ne 0 ]; then
            node - <<'NODE'
          const fs = require('node:fs');
          const lines = fs.readFileSync('/tmp/e2e-partition.log', 'utf8').split('\n');
          const numbered = lines.map((line, index) => `${index + 1}: ${line}`);
          const failures = numbered
            .filter((line) => /FAIL|Error|error|expected|not ok|timed out|timeout|Traceback|AssertionError|Unhandled|exit code|exited/.test(line))
            .slice(-60)
            .join('\n');
          const tail = numbered.slice(-50).join('\n');
          const oneLine = (value) => value.replace(/\r/g, ' ').replace(/\n/g, ' | ');
          const annotate = (title, value) => {
            const message = oneLine(value);
            console.log(`::error title=${title}::${message.slice(-3800)}`);
          };
          const firstFailure = lines.findIndex((line) =>
            /\[FAIL\].*(Real-browser|AssertionError)|AssertionError/.test(line)
          );
          const context = firstFailure >= 0 ? numbered.slice(firstFailure, firstFailure + 28).join('\n') : failures;
          console.log('=== E2E failure context ===');
          console.log(context);
          annotate('E2E failure context', context);
          annotate('E2E failure lines', failures);
          annotate('E2E failure tail', tail);
          if (process.env.GITHUB_STEP_SUMMARY) {
            fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, `### E2E failure context\n\n\`\`\`\n${context}\n\`\`\`\n\n### E2E failure lines\n\n\`\`\`\n${failures}\n\`\`\`\n\n### E2E failure tail\n\n\`\`\`\n${tail}\n\`\`\`\n`);
          }
          NODE
          fi
          exit "$status"

      # The micro tab has its own browser flow: 2/2, the 0/2 practice branch, a seeded due review,
      # the runtime switch, the source anchor and a 390 px fit. The reducer itself is in test:micro.
      - name: "Check micro-learning: Home door, diagnostics, review, runtime switch and a 390 px tab"
        run: npm run test:e2e:micro

  bundle-suites:
    name: Browser suites — the built bundle, control pairs, tour and home
    needs: [changes, build-workbench]
    if: github.ref == 'refs/heads/main' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || needs.changes.outputs.browser == 'true'
    runs-on: ubuntu-latest
    env:
      # The Pages sweep grades a sample in Firefox as the second browser; every other suite here is
      # Chromium, so this is the only lane that installs both.
      PW_BROWSERS: chromium firefox
      # The suite reads this selector itself: `both` runs Chromium and Firefox, a browser name
      # selects one. It is not the install list.
      PLAYWRIGHT_BROWSERS: both

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Restore node_modules
        id: node-modules
        uses: actions/cache@v4
        with:
          path: node_modules
          key: node-modules-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install the locked dependencies
        if: steps.node-modules.outputs.cache-hit != 'true'
        run: npm ci --prefer-offline --no-audit --no-fund

      - name: Fetch the bundle the build job produced
        uses: actions/download-artifact@v4
        with:
          name: workbench-dist
          path: dist

      - name: Stamp the restored bundle as newer than this checkout
        run: find dist -exec touch {} +

      - name: Read the installed Playwright version
        id: pw
        run: node -p "'v=' + require('playwright-core/package.json').version" >> "$GITHUB_OUTPUT"

      - name: Restore the Playwright browsers
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.pw.outputs.v }}
          restore-keys: |
            playwright-${{ runner.os }}-

      - name: Install the Playwright browsers (only a cache miss needs them)
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright-core install ${{ env.PW_BROWSERS }}
        timeout-minutes: 8

      - name: Install the Playwright OS libraries (only a cache miss needs them)
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright-core install-deps ${{ env.PW_BROWSERS }}
        timeout-minutes: 10

      - name: Run the bundle partition (built bundle, control pairs, the tour, home)
        env:
          MECHALAB_PREBUILT_DIST: "1"
        run: |
          set +e
          npm run test:workbench -- --partition bundle > /tmp/bundle-partition.log 2>&1
          status=$?
          cat /tmp/bundle-partition.log
          if [ "$status" -ne 0 ]; then
            node - <<'NODE'
          const fs = require('node:fs');
          const lines = fs.readFileSync('/tmp/bundle-partition.log', 'utf8').split('\n');
          const numbered = lines.map((line, index) => `${index + 1}: ${line}`);
          const failures = numbered
            .filter((line) => /FAIL|Error|error|expected|not ok|timed out|timeout|Traceback|AssertionError|Unhandled|exit code|exited/.test(line))
            .slice(-60)
            .join('\n');
          const tail = numbered.slice(-50).join('\n');
          const oneLine = (value) => value.replace(/\r/g, ' ').replace(/\n/g, ' | ');
          const annotate = (title, value) => {
            const message = oneLine(value);
            console.log(`::error title=${title}::${message.slice(-3800)}`);
          };
          const firstFailure = lines.findIndex((line) =>
            /\[FAIL\]|AssertionError/.test(line)
          );
          const context = firstFailure >= 0 ? numbered.slice(firstFailure, firstFailure + 28).join('\n') : failures;
          console.log('=== Bundle failure context ===');
          console.log(context);
          annotate('Bundle failure context', context);
          annotate('Bundle failure lines', failures);
          annotate('Bundle failure tail', tail);
          if (process.env.GITHUB_STEP_SUMMARY) {
            fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, `### Bundle failure context\n\n\`\`\`\n${context}\n\`\`\`\n\n### Bundle failure lines\n\n\`\`\`\n${failures}\n\`\`\`\n\n### Bundle failure tail\n\n\`\`\`\n${tail}\n\`\`\`\n`);
          }
          NODE
          fi
          exit "$status"

      - name: "Check the 3.0 game: prologue, Mission Control, journey map, Black Box, award ledger"
        run: npm run test:e2e:game

  audit-suites:
    name: Audits — theme, axe, Lighthouse, the surface snapshot, label sizes
    needs: [changes, build-workbench]
    if: github.ref == 'refs/heads/main' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || needs.changes.outputs.browser == 'true'
    runs-on: ubuntu-latest
    env:
      PW_BROWSERS: chromium

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Restore node_modules
        id: node-modules
        uses: actions/cache@v4
        with:
          path: node_modules
          key: node-modules-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install the locked dependencies
        if: steps.node-modules.outputs.cache-hit != 'true'
        run: npm ci --prefer-offline --no-audit --no-fund

      - name: Fetch the bundle the build job produced
        uses: actions/download-artifact@v4
        with:
          name: workbench-dist
          path: dist

      - name: Stamp the restored bundle as newer than this checkout
        run: find dist -exec touch {} +

      - name: Read the installed Playwright version
        id: pw
        run: node -p "'v=' + require('playwright-core/package.json').version" >> "$GITHUB_OUTPUT"

      - name: Restore the Playwright browsers
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.pw.outputs.v }}
          restore-keys: |
            playwright-${{ runner.os }}-

      - name: Install the Playwright browsers (only a cache miss needs them)
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright-core install ${{ env.PW_BROWSERS }}
        timeout-minutes: 8

      - name: Install the Playwright OS libraries (only a cache miss needs them)
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright-core install-deps ${{ env.PW_BROWSERS }}
        timeout-minutes: 10

      # What the bundle costs, in gzipped bytes, against docs/weight-budget.json: a metric over its
      # budget fails, and so does a budget the build no longer produces anything for. It reads the
      # `dist/` this lane already downloaded — signed_in on CI — so it costs no extra build.
      - name: "Check the weight budget: gzipped shell, largest chunk, and no metric left unmeasured"
        run: npm run check:weight

      - name: "Check light/dark: toggle contract, and WCAG contrast on all sixteen tabs in both modes"
        run: npm run test:theme:e2e

      - name: "Check accessibility: axe over all sixteen tabs in both themes"
        run: npm run check:axe

      - name: "Check Lighthouse: best-practices, SEO and accessibility on the built bundle"
        run: npm run check:lighthouse

      - name: "Check the settle gate: a count that lands after the pane goes quiet is waited for"
        run: npm run test:settle

      # A failed run's log is not readable without repository admin, so the checker's own drift rows
      # are republished as check annotations and a step summary: a red gate that names the surface and
      # the field it moved, instead of a step that only says "failed". The report is read from
      # `--json-out` rather than stdout, where npm's script banner would land in it.
      - name: "Check the surface snapshot: every tab in every palette is still shaped the same"
        run: |
          set +e
          npm run check:snapshot -- --json-out /tmp/surface-drift.json
          status=$?
          if [ "$status" -ne 0 ]; then
            node - <<'NODE'
          const fs = require('node:fs');
          const say = (line) => console.log(line);
          let data = null;
          try {
            data = JSON.parse(fs.readFileSync('/tmp/surface-drift.json', 'utf8'));
          } catch (error) {
            say(`::error title=Surface drift unreadable::${error.message}`);
          }
          if (data) {
            const rows = data.drift ?? [];
            say(`::error title=Surface drift::${rows.length} field(s) differ across ${data.surfaces} measured surface(s)`);
            for (const row of rows.slice(0, 60)) {
              if (row.part === 'surface') {
                say(`::error title=${row.surface}::${row.actual}`);
                continue;
              }
              const label = `${row.surface} ${row.part}.${row.field}`;
              const body = `expected ${JSON.stringify(row.expected)} got ${JSON.stringify(row.actual)}`;
              say(`::error title=${label}::${body}`);
            }
            for (const name of data.stale ?? []) {
              say(`::error title=${name}::in the snapshot, not produced by the sweep`);
            }
            if (process.env.GITHUB_STEP_SUMMARY) {
              const lines = rows.map((row) =>
                row.part === 'surface'
                  ? `- \`${row.surface}\` — ${row.actual}`
                  : `- \`${row.surface}\` \`${row.part}.${row.field}\` — expected \`${JSON.stringify(
                      row.expected
                    )}\`, got \`${JSON.stringify(row.actual)}\``
              );
              for (const name of data.stale ?? []) lines.push(`- \`${name}\` — stale in the snapshot`);
              fs.appendFileSync(
                process.env.GITHUB_STEP_SUMMARY,
                `### Surface drift (${rows.length} field(s))\n\n${lines.join('\n')}\n`
              );
            }
          }
          NODE
          fi
          exit "$status"

      - name: "Check label sizes: the quiet row, the folded toolbar, and reading text at 17-18 px"
        run: npm run check:labels

