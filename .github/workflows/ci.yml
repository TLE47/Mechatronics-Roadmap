name: Mechatronics Roadmap & Reference Labs CI

on:
  push:
    branches: ["main", "master", "**"]
  pull_request:
    branches: ["main", "master"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  verify-and-test:
    name: Repository Integrity, Math/Mermaid Lint & Labs 00-08 (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Verify Markdown structure, internal links, Mermaid diagrams & LaTeX math fences
        run: python3 scripts/verify_repo.py --verbose

      - name: Run all 12 Python & C++20 Reference Simulations, CAD, PCB EDA & Firmware Tests
        run: python3 scripts/run_all_labs.py --verbose

  deploy-pages:
    name: Deploy MechaLab Workbench to GitHub Pages
    needs: verify-and-test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "."
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

