name: Mechatronics Roadmap & Reference Labs CI

on:
  push:
    branches: ["main", "master", "**"]
  pull_request:
    branches: ["main", "master"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  verify-and-test:
    name: Repository Integrity, Math/Mermaid Lint & Labs 00-08 (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Verify Markdown structure, internal links, Mermaid diagrams & LaTeX math fences
        run: |
          python3 scripts/verify_repo.py --verbose
          python3 scripts/clean_tex.py --check
          python3 scripts/validate_modules.py
          python3 scripts/lint_lessons.py
          python3 scripts/lint_modules.py
          python3 scripts/module_parity.py --check
          python3 tests/test_module_parity.py
          python3 scripts/generate_plant_data.py --check
          python3 tests/test_plant.py
          python3 tests/test_model_levels.py
          python3 scripts/check_term_order.py
          python3 scripts/generate_python_lessons_data.py --check
          python3 tests/test_exercises.py
          python3 scripts/run_exercise.py --verbose
          python3 tests/test_exercise_package.py

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Typeset every formula (Markdown modules + workbench curriculum) with KaTeX
        run: |
          npm install --no-save --no-audit --no-fund katex@0.16.21
          node scripts/audit_math.mjs .

      - name: Run all 13 Python & C++20 Reference Simulations, Module Expected-Output Diffs, CAD, PCB EDA & Firmware Tests
        run: python3 scripts/run_all_labs.py --verbose

  build-workbench:
    name: Typecheck & build the Vite workbench bundle
    needs: verify-and-test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install the locked dependencies
        run: npm ci

      - name: Typecheck and build the production bundle (base /Mechatronics-Roadmap/)
        run: npm run build

      - name: Run automated Workbench UI smoke tests (Beginner/Advanced mode, Runner, Placement Quiz & Progress Export)
        run: npm run test:smoke

      - name: Install Playwright Chromium & run real-browser End-to-End (E2E) Workbench tests
        run: |
          npx playwright-core install --with-deps chromium firefox
          npm run test:e2e

      - name: Check the built Pages bundle at its real base path (later-track lessons, tablet width, Chromium + Firefox)
        run: npm run test:e2e:pages

      - name: Configure Pages
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: actions/configure-pages@v5

      - name: Upload the built workbench as the Pages artifact
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy-pages:
    name: Deploy MechaLab Workbench to GitHub Pages
    needs: build-workbench
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy the built bundle to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
