name: Weekly Link, Lesson & Arduino Uno Sketch Verification

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

# Only the scheduled/dispatch run pushes (one history row); the scope is declared here because the
# default token is read-only in some repository settings and the push step would fail silently there.
permissions:
  contents: write
  # The rise gate files an issue naming the URLs a scheduled run could not verify.
  issues: write

jobs:
  verify-lessons-and-links:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Lint all 48 beginner lessons (enforce YAML ideas <= 2 & template rules)
        run: python3 scripts/lint_lessons.py

      - name: Verify in-browser Python lesson data is in sync with markdown lessons
        run: python3 scripts/generate_python_lessons_data.py --check

      - name: Run all Python & host C++ exercise unit tests
        run: python3 tests/test_exercises.py

      # A week-old verdict for a page that still serves is worth reusing; the script keeps served
      # verdicts for 7 days and retries anything it could not check within 6 hours itself.
      - name: Restore the URL verdict cache
        uses: actions/cache@v4
        with:
          path: .link_cache.json
          key: link-cache-${{ github.run_id }}
          restore-keys: |
            link-cache-

      # The weekly run is the one that fails on a rising pile: PR runs compare against a history file
      # they do not own, so a transient bot wall would red a contributor's branch. `--fail-on-rise`
      # reads the last committed row's URL list and exits 1 when a page that was checked then is
      # unverified now - a count alone cannot tell a new wall from one that was already there.
      - name: Verify all external URLs and static-page HTML headings
        id: sweep
        run: |
          python3 scripts/check_links.py --write-report --history docs/link-check-history.jsonl \
            --sweep-state .sweep-state.json \
            ${{ (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && '--fail-on-rise' || '' }}

      # A red job is a log line a maintainer has to go looking for. The gate writes the new URLs to
      # a JSON file before it exits, and this turns that file into a tracked issue: one per distinct
      # set, deduplicated by a fingerprint in the body, so a retried job or the same wall next week
      # cannot open a second one. Scoped to `sweep` because an unrelated lint failure has no report.
      - name: File an issue for newly unverified URLs
        if: failure() && steps.sweep.outcome == 'failure' && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/file_rise_issue.py --report .sweep-state.json

      # The other half of the tracker: a wall that lifts closes its own issue. Runs on the same
      # state file whether the gate passed or failed, because the sweep writes it before exiting;
      # `cancelled` is the one outcome where the file is not this run's.
      - name: Close rise issues whose URLs verify again
        if: always() && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && steps.sweep.outcome != 'cancelled'
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/file_rise_issue.py --resolve --report .sweep-state.json

      # The sweep's own numbers, not a badge: `not_checked` is the pile a human still has to open by
      # hand, so a rise across weeks is visible in one committed file.
      # `always()` because the row is the evidence for a failed rise gate: without it the baseline
      # would never move and the next weekly run would report the same delta.
      - name: Record the sweep's not-checked count (scheduled runs only)
        if: always() && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
        run: |
          if git diff --quiet -- docs/link-check-history.jsonl; then
            echo "No new history row."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/link-check-history.jsonl
          git commit -m "Record the link sweep's served and not-checked counts"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push

  compile-arduino-uno-sketches:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install arduino-cli and arduino:avr core
        uses: arduino/setup-arduino-cli@v2

      - name: Install Arduino AVR Boards (Arduino Uno)
        run: |
          arduino-cli core update-index
          arduino-cli core install arduino:avr

      - name: Extract and compile all 8 Stage 0 Arduino Uno sketches (Starter + Full Solution)
        run: python3 scripts/extract_and_compile_sketches.py --compile-arduino-cli
