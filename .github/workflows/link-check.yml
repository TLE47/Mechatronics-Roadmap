name: Weekly Link, Lesson & Arduino Uno Sketch Verification

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

# Only the scheduled/dispatch run pushes (one history row and the dashboard module regenerated from
# it); the scope is declared here because the default token is read-only in some repository settings
# and the push step would fail silently there.
permissions:
  contents: write
  # The rise gate files an issue naming the URLs a scheduled run could not verify.
  issues: write

jobs:
  verify-lessons-and-links:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # These three gates were re-run here on every pull request, and `ci.yml` already runs all of
      # them on the same bytes: the lesson lint, the generated lesson data and `tests/test_exercises`
      # (through its discovery run in `verify-and-test`). A second workflow grading one commit is a
      # verdict that can only disagree with the first, and it was measured at 4-8 s of runner time
      # per push (runs 40791783568, 40784308531, 40745056287, 40742627152). They stay on the weekly
      # and dispatched run, where no `ci.yml` run exists to inherit them from - and the sweep below
      # still runs on every event, because that verdict is this workflow's own.
      - name: Lint all 48 beginner lessons (weekly and dispatched runs only - ci.yml owns it)
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: python3 scripts/lint_lessons.py

      - name: Verify in-browser Python lesson data is in sync (weekly and dispatched runs only)
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: python3 scripts/generate_python_lessons_data.py --check

      - name: Run all Python and host C++ exercise unit tests (weekly and dispatched runs only)
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: python3 tests/test_exercises.py

      # A week-old verdict for a page that still serves is worth reusing; the script keeps served
      # verdicts for 7 days and retries anything it could not check within 6 hours itself.
      - name: Restore the URL verdict cache
        uses: actions/cache@v4
        with:
          path: .link_cache.json
          key: link-cache-${{ github.run_id }}
          restore-keys: |
            link-cache-

      # The weekly run is the one that fails on a rising pile: PR runs compare against a history file
      # they do not own, so a transient bot wall would red a contributor's branch. `--fail-on-rise`
      # reads the last committed row's URL list and exits 1 when a page that was checked then is
      # unverified now - a count alone cannot tell a new wall from one that was already there.
      - name: Verify all external URLs and static-page HTML headings
        id: sweep
        run: |
          python3 scripts/check_links.py --write-report --history docs/link-check-history.jsonl \
            --sweep-state .sweep-state.json \
            ${{ (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && '--fail-on-rise' || '' }}

      # A red job is a log line a maintainer has to go looking for. The gate writes the new URLs to
      # a JSON file before it exits, and this turns that file into a tracked issue: one per distinct
      # set, deduplicated by a fingerprint in the body, so a retried job or the same wall next week
      # cannot open a second one. Scoped to `sweep` because an unrelated lint failure has no report.
      - name: File an issue for newly unverified URLs
        if: failure() && steps.sweep.outcome == 'failure' && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/file_rise_issue.py --report .sweep-state.json

      # The other half of the tracker: a wall that lifts closes its own issue. Runs on the same
      # state file whether the gate passed or failed, because the sweep writes it before exiting;
      # `cancelled` is the one outcome where the file is not this run's.
      - name: Close rise issues whose URLs verify again
        if: always() && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && steps.sweep.outcome != 'cancelled'
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/file_rise_issue.py --resolve --report .sweep-state.json

      # The sweep's own numbers, not a badge: `not_checked` is the pile a human still has to open by
      # hand, so a rise across weeks is visible in one committed file.
      # `always()` because the row is the evidence for a failed rise gate: without it the baseline
      # would never move and the next weekly run would report the same delta.
      #
      # The dashboard's module is regenerated and committed in the same step, not by a follow-up:
      # `ci.yml` fails the pair when they disagree, so a commit that carried only the row turned every
      # PR red until someone regenerated it by hand (`be434a0` did exactly that to `main`). Generation
      # runs before the diff check so a row that somehow wrote nothing still repairs a stale module,
      # and a failing generator fails this step rather than pushing half a record.
      #
      # The row also moves the Links tab's height: that tab draws its host and run tables from the
      # module this step regenerates, so `docs/surface-snapshot.json` no longer describes the page
      # (`a79e857` turned `main` red on exactly that, +87 px with counts and styles unchanged). The
      # re-record is not done here: the snapshot is `ci.yml`'s audits job's own measurement, so that job
      # follows the data before it checks it (`scripts/record_links_surface.py`, a main-only step
      # there), and this commit stays one row and one module.
      - name: Record the sweep's counts and regenerate the link history (scheduled runs only)
        if: always() && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
        run: |
          python3 scripts/generate_link_history_data.py
          if git diff --quiet -- docs/link-check-history.jsonl app/src/data/linkHistoryData.ts; then
            echo "No new history row."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/link-check-history.jsonl app/src/data/linkHistoryData.ts
          git commit -m "Record the link sweep's counts and regenerate its history data"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push

  compile-arduino-uno-sketches:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install arduino-cli and arduino:avr core
        uses: arduino/setup-arduino-cli@v2

      - name: Install Arduino AVR Boards (Arduino Uno)
        run: |
          arduino-cli core update-index
          arduino-cli core install arduino:avr

      - name: Extract and compile all 8 Stage 0 Arduino Uno sketches (Starter + Full Solution)
        run: python3 scripts/extract_and_compile_sketches.py --compile-arduino-cli
