name: Weekly Link & Lesson Verification

on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

jobs:
  verify-links-and-lessons:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Lint Beginner Lessons (Template & Word Counts)
        run: python3 scripts/lint_lessons.py

      - name: Run All Lesson Exercise Solutions & Quiz Unit Tests
        run: python3 -m unittest discover -s tests -p "test_*.py" -v

      - name: Check External Resource Links
        run: python3 scripts/check_links.py
