name: Weekly Embed Policy Recheck

# The embed report is a point-in-time header probe, not a permanent truth. The fast gates only check
# that it is fresh and complete; this weekly job asks every allowlisted host again and fails if a
# verdict moved. It deliberately writes nothing: a provider that started sending X-Frame-Options must
# be reviewed and the report regenerated by a person, not silently refreshed by CI.

on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  recheck:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Verify the committed report is fresh and covers every host
        run: python3 scripts/verify_resource_embeds.py --check

      - name: Probe every host and compare verdicts
        run: python3 scripts/verify_resource_embeds.py --revalidate
