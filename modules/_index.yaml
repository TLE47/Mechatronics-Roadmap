legacy:
  - id: 00-foundations.T1.01
    title: "Track 00 (Tier 1): Calculus as while Loops, 2D Rotations & RC Smoothing"
    prereqs: [00-foundations.T1.00e]
    introduces: [symplectic_euler_integration, so2_rotation_matrix, atan2_angle_wrapping, exponential_moving_average_filter, rc_cutoff_phase_lag]

  - id: 01-electronics.T1.02
    title: "Track 01 (Tier 1): Breadboard H-Bridges (DRV8833), Logic Levels & Star Grounding"
    prereqs: [00-foundations.T1.01, 01-electronics.T1.01b]
    introduces: [cmos_logic_levels_esd_clamping, open_drain_i2c_pullups, h_bridge_decay_modes, star_grounding, bulk_vs_ceramic_decoupling]

  - id: 02-mechanics.T1.03
    title: "Track 02 (Tier 1): 2D Planar Kinematics, Gear Ratios & Double-Shear Bearings"
    prereqs: [00-foundations.T1.01]
    introduces: [planar_2link_forward_kinematics, law_of_cosines_inverse_kinematics, elbow_up_down_branch_selection, single_vs_double_shear_joint]

  - id: 03-sensors.T1.04
