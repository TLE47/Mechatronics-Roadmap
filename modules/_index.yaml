    prereqs: [01-electronics.T1.02]
    introduces: [diametric_hall_magnetic_encoder, six_step_trapezoidal_commutation, open_loop_three_phase_sine_modulation, electrical_vs_mechanical_pole_pairs]

  - id: 04-embedded.T1.05
